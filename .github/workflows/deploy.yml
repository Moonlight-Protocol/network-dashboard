name: Deploy to Tigris

on:
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate production config
        env:
          COUNCIL_PLATFORM_URL: ${{ secrets.COUNCIL_PLATFORM_URL }}
          STELLAR_NETWORK: ${{ secrets.STELLAR_NETWORK }}
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          deno eval "
            const url = Deno.env.get('COUNCIL_PLATFORM_URL') || '';
            if (!url) { console.error('COUNCIL_PLATFORM_URL secret is empty'); Deno.exit(1); }
            const stellarNetwork = Deno.env.get('STELLAR_NETWORK') || '';
            if (!stellarNetwork) { console.error('STELLAR_NETWORK secret is empty'); Deno.exit(1); }
            const rpcUrl = Deno.env.get('RPC_URL') || '';
            if (!rpcUrl) { console.error('RPC_URL secret is empty'); Deno.exit(1); }
            const config = {
              environment: 'production',
              stellarNetwork,
              rpcUrl,
              councilPlatformUrl: url,
            };
            Deno.writeTextFileSync('public/config.js',
              'window.__DASHBOARD_CONFIG__ = ' + JSON.stringify(config, null, 2) + ';\n');
            console.log('Generated config.js pointing at', url);
          "

      - name: Build production bundle
        run: deno task build -- --production

      - name: Deploy to Tigris (testnet)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          aws s3 sync public/ s3://network-dashboard/ \
            --endpoint-url https://fly.storage.tigris.dev \
            --acl public-read \
            --delete \
            --no-progress

  deploy-mainnet:
    runs-on: ubuntu-latest
    environment: mainnet
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate mainnet config
        env:
          COUNCIL_PLATFORM_URL: ${{ secrets.MAINNET_COUNCIL_PLATFORM_URL }}
          STELLAR_NETWORK: ${{ secrets.MAINNET_STELLAR_NETWORK }}
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          deno eval "
            const url = Deno.env.get('COUNCIL_PLATFORM_URL') || '';
            if (!url) { console.error('MAINNET_COUNCIL_PLATFORM_URL secret is empty'); Deno.exit(1); }
            const stellarNetwork = Deno.env.get('STELLAR_NETWORK') || '';
            if (!stellarNetwork) { console.error('MAINNET_STELLAR_NETWORK secret is empty'); Deno.exit(1); }
            const rpcUrl = Deno.env.get('RPC_URL') || '';
            if (!rpcUrl) { console.error('MAINNET_RPC_URL secret is empty'); Deno.exit(1); }
            const config = {
              environment: 'production',
              stellarNetwork,
              rpcUrl,
              councilPlatformUrl: url,
            };
            Deno.writeTextFileSync('public/config.js',
              'window.__DASHBOARD_CONFIG__ = ' + JSON.stringify(config, null, 2) + ';\n');
            console.log('Generated config.js pointing at', url);
          "

      - name: Build production bundle
        run: deno task build -- --production

      - name: Deploy to Tigris (mainnet)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MAINNET_TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MAINNET_TIGRIS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          aws s3 sync public/ s3://mainnet-network-dashboard/ \
            --endpoint-url https://fly.storage.tigris.dev \
            --acl public-read \
            --delete \
            --no-progress
