name: Deploy to Tigris

on:
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      COUNCIL_PLATFORM_URL: "${{ secrets.COUNCIL_PLATFORM_URL }}"
      NETWORK_DASHBOARD_PLATFORM_URL: "${{ secrets.NETWORK_DASHBOARD_PLATFORM_URL }}"
      STELLAR_NETWORK: "${{ secrets.STELLAR_NETWORK }}"
      RPC_URL: "${{ secrets.RPC_URL }}"
      EXPLORER_BASE_URL: "${{ secrets.EXPLORER_BASE_URL }}"
      POSTHOG_KEY: "${{ secrets.POSTHOG_PROJECT_TOKEN }}"
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate testnet config inputs
        run: |
          set -euo pipefail
          for var in COUNCIL_PLATFORM_URL NETWORK_DASHBOARD_PLATFORM_URL STELLAR_NETWORK RPC_URL POSTHOG_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Required env var $var is empty"
              exit 1
            fi
          done
          case "$STELLAR_NETWORK" in
            testnet|mainnet) ;;
            *) echo "::error::STELLAR_NETWORK must be 'testnet' or 'mainnet' (got: $STELLAR_NETWORK)"; exit 1 ;;
          esac
          for var in COUNCIL_PLATFORM_URL NETWORK_DASHBOARD_PLATFORM_URL RPC_URL; do
            val="${!var}"
            case "$val" in
              https://*) ;;
              *) echo "::error::$var must start with https:// (got: $val)"; exit 1 ;;
            esac
          done
          # EXPLORER_BASE_URL is optional (when unset the SPA renders no
          # explorer links); when set it must be https.
          if [ -n "$EXPLORER_BASE_URL" ]; then
            case "$EXPLORER_BASE_URL" in
              https://*) ;;
              *) echo "::error::EXPLORER_BASE_URL must start with https:// when set (got: $EXPLORER_BASE_URL)"; exit 1 ;;
            esac
          fi

      - name: Generate production config
        run: |
          deno eval "
            const config = {
              environment: 'production',
              stellarNetwork: Deno.env.get('STELLAR_NETWORK'),
              rpcUrl: Deno.env.get('RPC_URL'),
              councilPlatformUrl: Deno.env.get('COUNCIL_PLATFORM_URL'),
              networkDashboardPlatformUrl: Deno.env.get('NETWORK_DASHBOARD_PLATFORM_URL'),
              explorerBaseUrl: Deno.env.get('EXPLORER_BASE_URL'),
              posthogKey: Deno.env.get('POSTHOG_KEY'),
              posthogHost: 'https://us.i.posthog.com',
            };
            Deno.writeTextFileSync('public/config.js',
              'window.__DASHBOARD_CONFIG__ = ' + JSON.stringify(config, null, 2) + ';\n');
            console.log('Generated config.js');
          "

      - name: Build production bundle
        run: deno task build -- --production

      - name: Upload source maps to PostHog
        env:
          POSTHOG_CLI_API_KEY: "${{ secrets.POSTHOG_CLI_API_KEY }}"
          POSTHOG_CLI_PROJECT_ID: "345524"
          POSTHOG_CLI_HOST: "https://us.posthog.com"
        run: |
          npx --yes @posthog/cli sourcemap inject --directory public/
          npx --yes @posthog/cli sourcemap upload --directory public/

      - name: Deploy to Tigris (testnet)
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.TIGRIS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}"
          AWS_REGION: auto
        run: |
          aws s3 sync public/ s3://network-dashboard/ \
            --endpoint-url https://fly.storage.tigris.dev \
            --acl public-read \
            --delete \
            --exclude "*.map" \
            --no-progress
          # config.js must NOT be edge-cached — it carries the WS URL and other
          # deploy-time substitutions. Other assets keep the bucket default.
          aws s3 cp public/config.js s3://network-dashboard/config.js \
            --endpoint-url https://fly.storage.tigris.dev \
            --acl public-read \
            --cache-control "no-cache, max-age=0" \
            --content-type text/javascript \
            --no-progress

  deploy-mainnet:
    runs-on: ubuntu-latest
    environment: mainnet
    env:
      COUNCIL_PLATFORM_URL: "${{ secrets.MAINNET_COUNCIL_PLATFORM_URL }}"
      NETWORK_DASHBOARD_PLATFORM_URL: "${{ secrets.MAINNET_NETWORK_DASHBOARD_PLATFORM_URL }}"
      STELLAR_NETWORK: "${{ secrets.MAINNET_STELLAR_NETWORK }}"
      RPC_URL: "${{ secrets.MAINNET_RPC_URL }}"
      EXPLORER_BASE_URL: "${{ secrets.MAINNET_EXPLORER_BASE_URL }}"
      POSTHOG_KEY: "${{ secrets.POSTHOG_PROJECT_TOKEN }}"
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate mainnet config inputs
        run: |
          set -euo pipefail
          for var in COUNCIL_PLATFORM_URL NETWORK_DASHBOARD_PLATFORM_URL STELLAR_NETWORK RPC_URL POSTHOG_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Required env var $var is empty"
              exit 1
            fi
          done
          case "$STELLAR_NETWORK" in
            testnet|mainnet) ;;
            *) echo "::error::STELLAR_NETWORK must be 'testnet' or 'mainnet' (got: $STELLAR_NETWORK)"; exit 1 ;;
          esac
          for var in COUNCIL_PLATFORM_URL NETWORK_DASHBOARD_PLATFORM_URL RPC_URL; do
            val="${!var}"
            case "$val" in
              https://*) ;;
              *) echo "::error::$var must start with https:// (got: $val)"; exit 1 ;;
            esac
          done
          # EXPLORER_BASE_URL is optional (when unset the SPA renders no
          # explorer links); when set it must be https.
          if [ -n "$EXPLORER_BASE_URL" ]; then
            case "$EXPLORER_BASE_URL" in
              https://*) ;;
              *) echo "::error::EXPLORER_BASE_URL must start with https:// when set (got: $EXPLORER_BASE_URL)"; exit 1 ;;
            esac
          fi

      - name: Generate mainnet config
        run: |
          deno eval "
            const config = {
              environment: 'production',
              stellarNetwork: Deno.env.get('STELLAR_NETWORK'),
              rpcUrl: Deno.env.get('RPC_URL'),
              councilPlatformUrl: Deno.env.get('COUNCIL_PLATFORM_URL'),
              networkDashboardPlatformUrl: Deno.env.get('NETWORK_DASHBOARD_PLATFORM_URL'),
              explorerBaseUrl: Deno.env.get('EXPLORER_BASE_URL'),
              posthogKey: Deno.env.get('POSTHOG_KEY'),
              posthogHost: 'https://us.i.posthog.com',
            };
            Deno.writeTextFileSync('public/config.js',
              'window.__DASHBOARD_CONFIG__ = ' + JSON.stringify(config, null, 2) + ';\n');
            console.log('Generated config.js');
          "

      - name: Build production bundle
        run: deno task build -- --production

      - name: Upload source maps to PostHog
        env:
          POSTHOG_CLI_API_KEY: "${{ secrets.POSTHOG_CLI_API_KEY }}"
          POSTHOG_CLI_PROJECT_ID: "345524"
          POSTHOG_CLI_HOST: "https://us.posthog.com"
        run: |
          npx --yes @posthog/cli sourcemap inject --directory public/
