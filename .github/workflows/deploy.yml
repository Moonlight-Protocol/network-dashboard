          aws s3 cp public/config.js s3://mainnet-network-dashboard/config.js \
            --endpoint-url https://fly.storage.tigris.dev \
            --acl public-read \
            --cache-control "no-cache, max-age=0" \
            --content-type text/javascript \
            --no-progress
